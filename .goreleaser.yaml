# GoReleaser: タグ push で OS/arch 別の静的バイナリ + checksums.txt を
# GitHub Releases に発行。install.sh / selfupdate と asset 名を一致させる:
#   claude-master_<os>_<arch>  /  checksums.txt
#
#   git tag v0.1.0 && git push origin v0.1.0   # → CI(goreleaser) が発行
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: claude-master
    main: ./cmd/claude-master
    binary: claude-master
    env:
      - CGO_ENABLED=0          # 完全静的・依存なし単一バイナリ
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: raw
    # アーカイブせず生バイナリを配布（curl 一発で実行可能に）
    formats: [binary]
    name_template: "claude-master_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  draft: false
  prerelease: auto

changelog:
  use: github
  sort: asc
